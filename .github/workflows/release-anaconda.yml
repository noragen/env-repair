name: Release (anaconda.org)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      anaconda_user:
        description: "Target Anaconda username (channel owner), e.g. 'noragen'"
        required: true
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: "3.13"
          channels: conda-forge
          conda-remove-defaults: true
          channel-priority: strict

      - name: Install build tools
        shell: bash -l {0}
        run: |
          conda install -y -n base --override-channels -c conda-forge conda-build anaconda-client
          conda run --no-capture-output -n base conda-build --version

      - name: Build conda package
        shell: bash -l {0}
        run: |
          conda run --no-capture-output -n base conda-build conda.recipe

      - name: Upload to anaconda.org
        shell: bash -l {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_USER: ${{ inputs.anaconda_user || github.repository_owner }}
        run: |
          if [ -z "${ANACONDA_TOKEN}" ]; then
            echo "Missing ANACONDA_TOKEN secret" 1>&2
            exit 2
          fi
          PKG="$(conda run -n base conda-build conda.recipe --output)"
          test -f "${PKG}"
          echo "Uploading: ${PKG}"
          conda run --no-capture-output -n base anaconda -t "${ANACONDA_TOKEN}" upload -u "${ANACONDA_USER}" --force "${PKG}"
