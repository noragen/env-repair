name: Build (conda recipe)

on:
  pull_request:
    paths:
      - "conda.recipe/**"
      - "pyproject.toml"
      - "env_repair/**"
      - "env_repair.py"
      - ".github/workflows/conda-build.yml"
  workflow_dispatch:

jobs:
  conda-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: "3.13"
          channels: conda-forge
          conda-remove-defaults: true
          channel-priority: strict

      - name: Install conda-build
        shell: bash -l {0}
        run: |
          conda install -y -n base --override-channels -c conda-forge conda-build
          conda run --no-capture-output -n base conda-build --version

      - name: Build recipe
        shell: bash -l {0}
        run: |
          conda run --no-capture-output -n base conda-build conda.recipe
