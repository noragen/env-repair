schema_version: 1

context:
  name: "env-repair"
  version: "0.2.9"
  python_min: "3.9"
  sdist_name: ${{ name | replace("-", "_") }}
  pypi_first: ${{ name[0] }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ pypi_first }}/${{ name }}/${{ sdist_name }}-${{ version }}.tar.gz
  sha256: b717c796c26b9beb51d575d68f4dfe2a7cd26d2d2b94be590a6646528c975927

build:
  noarch: python
  number: 0
  script:
    - if: win
      then: '"%PYTHON%" -m pip install . -vv --no-deps --no-build-isolation'
      else: '"${PYTHON}" -m pip install . -vv --no-deps --no-build-isolation'
  python:
    entry_points:
      - env-repair = env_repair.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - env_repair
      pip_check: true
  - script:
      - env-repair --help

about:
  homepage: https://github.com/noragen/env-repair
  license: MIT
  license_file: LICENSE
  summary: Scan and repair venv/virtualenv/conda/mamba/micromamba/miniforge environments with mixed conda/pip installs.

extra:
  recipe-maintainers:
    - noragen
